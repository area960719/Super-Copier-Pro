name: Build .NET Framework 4.5

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.5 Reference Assemblies
        shell: pwsh
        run: |
          $url = 'https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net45/1.0.3'
          $target = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework'
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\net45.zip"
          Expand-Archive -Force "$env:TEMP\net45.zip" "$env:TEMP\net45"
          if (Test-Path "$target\v4.5") { Remove-Item -Recurse -Force "$target\v4.5" }
          Move-Item "$env:TEMP\net45\build\.NETFramework\v4.5" "$target"

      - name: Restore and Build Main App
        run: msbuild Super-Copier-Pro.csproj /p:Configuration=Release /p:TargetFrameworkVersion=v4.5 /t:Restore,Build

      - name: Restore and Build Shell Extension
        run: msbuild ShellExtension\SuperCopierShellExt.csproj /p:Configuration=Release /p:TargetFrameworkVersion=v4.5 /t:Restore,Build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Super-Copier-Pro-Release
          path: |
            bin/Release/Super-Copier-Pro.exe
            ShellExtension/bin/Release/SuperCopierShellExt.dll
            ShellExtension/Install.bat
