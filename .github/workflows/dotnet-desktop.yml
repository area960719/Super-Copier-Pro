name: Build .NET Desktop (WinForms)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Super-Copier-Pro.csproj

      - name: Build
        run: dotnet build Super-Copier-Pro.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Super-Copier-Pro.csproj -c Release -o ./artifacts --no-build

      # ESTE ES EL PASO QUE FALTABA: Subir la carpeta artifacts a GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-Copier-Pro-App
          path: ./artifacts/
