name: Build SuperCopierPro
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet publish SuperCopierPro.csproj -r win-x64 -c Release Release
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: SuperCopierPro
          path: SuperCopierPro/bin/Release/net8.0/win-x64/publish/
