name: Build SuperCopierPro
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SuperCopierPro.csproj

      - name: Build project
        run: dotnet publish SuperCopierPro.csproj -r win-x64 -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperCopierPro
          path: SuperCopierPro/bin/Release/net8.0/win-x64/publish/